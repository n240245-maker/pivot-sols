services:
  - type: web
    name: pivot-sols-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: FRONTEND_URL
        value: https://pivot-sols.vercel.app
      - key: EMAIL_PROVIDER
        value: brevo
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Pivot Sols
      - key: OTP_SECRET
        generateValue: true
      - key: CONTACT_TO_EMAIL
        sync: false
